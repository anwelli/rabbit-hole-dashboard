<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daily Rabbit Hole</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="rabbit-icon">🐇</span>
        <h1>Daily Rabbit Hole</h1>
      </div>
      <div class="greeting" id="greeting">Good day, curious mind</div>
    </header>

    <!-- NASA Section -->
    <section class="nasa-card card">
      <div class="loading-spinner" id="nasaSpinner">Loading space picture...</div>
      <div id="nasaContent" style="display: none;">
        <img id="nasaImage" class="nasa-image" alt="NASA APOD">
        <div class="nasa-text">
          <h2 id="nasaTitle"></h2>
          <p id="nasaExplanation"></p>
        </div>
      </div>
      <div id="nasaError" class="error-message" style="display: none;"></div>
    </section>

    <!-- Three columns -->
    <div class="three-columns">
      <!-- History -->
      <div class="history-card card">
        <h2>📅 Today in History</h2>
        <div class="loading-spinner" id="historySpinner">Fetching history...</div>
        <ul id="historyList" style="display: none;"></ul>
        <div id="historyError" class="error-message" style="display: none;"></div>
      </div>

      <!-- Wikipedia -->
      <div class="wiki-card card">
        <h2>📖 Random Wikipedia</h2>
        <div class="loading-spinner" id="wikiSpinner">Finding something interesting...</div>
        <div id="wikiContent" style="display: none;">
          <h3 id="wikiTitle"></h3>
          <p id="wikiExtract"></p>
          <a id="wikiLink" href="#" target="_blank" rel="noopener">Read more →</a>
        </div>
        <div id="wikiError" class="error-message" style="display: none;"></div>
      </div>

      <!-- Surprise Me: Button + Weather -->
      <div class="surprise-card card">
        <h2>🎲 Surprise Me</h2>
        <button id="surpriseBtn" class="action-btn">🎲 Get new article</button>
        <h3 class="weather-heading">🌤️ Weather</h3>
        <div class="weather-section">
          <div class="loading-spinner" id="weatherSpinner">Fetching weather...</div>
          <div id="weatherContent" style="display: none;">
            <div id="weatherMessage" class="surprise-message"></div>
            <div id="weatherAnimation"></div>
          </div>
          <div id="weatherError" class="error-message" style="display: none;"></div>
        </div>
      </div>
    </div>
  </div>
   <!-- Footer placeholder and loader -->
  <div id="footer-placeholder"></div>
  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Footer failed to load:', err));
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
